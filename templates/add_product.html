{% extends "base.html" %}

{% block content %}

<h2>상품 등록</h2>

<form method="POST">

<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<p>상품명</p>

<input
name="title"
required>

<p>가격</p>

<input
type="number"
name="price"
required>

<p>설명</p>

<textarea
name="description"
rows="8"
cols="50"
required></textarea>

<br><br>

<button>등록하기</button>

</form>

{% endblock %}
